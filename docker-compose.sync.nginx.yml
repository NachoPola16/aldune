services:
  aldune-sync:
    build:
      context: .
      dockerfile: src/Aldune.SyncServer/Dockerfile
    container_name: aldune-sync
    restart: unless-stopped
    environment:
      # Nombres de las variables: BrandIdentity.SyncTokenEnvVar / SyncTokensEnvVar (Aldune.Core).
      ALDUNE_SYNC_TOKEN: ${ALDUNE_SYNC_TOKEN:-}
      ALDUNE_SYNC_TOKENS: ${ALDUNE_SYNC_TOKENS:-}
      ALDUNE_DATA_DIR: /data
      ASPNETCORE_URLS: http://+:8080
    # Esta variante escucha en todas las interfaces y permite acceso directo desde la red. Si quieres
    # que solo los procesos del host accedan al puerto, añade 127.0.0.1: delante del puerto:
    # "127.0.0.1:${ALDUNE_SYNC_PORT:-8087}:8080". No expongas esta variante a Internet sin HTTPS
    # y autenticacion de red/proxy delante.
    # Cambia ALDUNE_SYNC_PORT si el puerto por defecto ya esta ocupado en el servidor.
    ports:
      - "${ALDUNE_SYNC_PORT:-8087}:8080"
    volumes:
      - aldune-sync-data:/data

volumes:
  # Nombre fisico del volumen en el servidor. Es configurable para que un servidor que ya
  # sincronizaba antes del cambio de marca siga usando el volumen que tenia, en vez de arrancar
  # con un almacen vacio: ver docs/SYNC.md, 'Migrar un servidor que ya sincronizaba'.
  aldune-sync-data:
    name: ${ALDUNE_SYNC_VOLUME:-aldune-sync-data}

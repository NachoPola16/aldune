services:
  fanote-sync:
    build:
      context: .
      dockerfile: src/Fanote.SyncServer/Dockerfile
    container_name: fanote-sync
    restart: unless-stopped
    environment:
      FANOTE_SYNC_TOKEN: ${FANOTE_SYNC_TOKEN:?Define FANOTE_SYNC_TOKEN in .env}
      FANOTE_SYNC_TOKENS: ${FANOTE_SYNC_TOKENS:-}
      FANOTE_DATA_DIR: /data
      ASPNETCORE_URLS: http://+:8080
    # Nginx y cloudflared son los unicos servicios que deben acceder al puerto.
    # Cambia FANOTE_SYNC_PORT si el puerto 8097 ya esta ocupado en el servidor.
    ports:
      - "127.0.0.1:${FANOTE_SYNC_PORT:-8097}:8080"
    volumes:
      - fanote-sync-data:/data

volumes:
  fanote-sync-data:

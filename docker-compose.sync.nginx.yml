services:
  aldune-sync:
    build:
      context: .
      dockerfile: src/Fanote.SyncServer/Dockerfile
    container_name: aldune-sync
    restart: unless-stopped
    environment:
      # ALDUNE_* es el nombre actual; el fallback conserva los .env antiguos.
      ALDUNE_SYNC_TOKEN: ${ALDUNE_SYNC_TOKEN:-${FANOTE_SYNC_TOKEN:-}}
      ALDUNE_SYNC_TOKENS: ${ALDUNE_SYNC_TOKENS:-${FANOTE_SYNC_TOKENS:-}}
      ALDUNE_DATA_DIR: /data
      ASPNETCORE_URLS: http://+:8080
    # Nginx y cloudflared son los unicos servicios que deben acceder al puerto.
    # Cambia ALDUNE_SYNC_PORT si el puerto 8097 ya esta ocupado en el servidor.
    ports:
      - "127.0.0.1:${ALDUNE_SYNC_PORT:-${FANOTE_SYNC_PORT:-8097}}:8080"
    volumes:
      - aldune-sync-data:/data

volumes:
  # Mantiene el nombre físico anterior para no perder los datos ya sincronizados.
  aldune-sync-data:
    name: fanote-sync-data

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Aldune.slnx

      - name: Build
        run: dotnet build Aldune.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Aldune.slnx --configuration Release --no-build --no-restore

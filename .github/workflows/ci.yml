name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Aldune.slnx

      # Falla si alguna dependencia (directa o transitiva) tiene una vulnerabilidad conocida.
      - name: Check vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list Aldune.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') { throw 'Hay paquetes con vulnerabilidades conocidas.' }

      - name: Build
        run: dotnet build Aldune.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Aldune.slnx --configuration Release --no-build --no-restore

  # Los tests de Kotlin (formato de sync, cifrado, dominio, motor) y la paridad con tests/vectors/ no corrían en ningún sitio:
  # un cambio que rompiera un lado solo se veía a mano. Sin emulador: solo la JVM y la compilación de la app.
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Sin setup-gradle: inyecta un plugin de Develocity cuyas dependencias no están en gradle/verification-metadata.xml y la
      # verificación de dependencias (que se queda activa) rechaza el build. La caché de Gradle la da setup-java.
      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle/libs.versions.toml

      # gradlew está versionado sin el bit de ejecución (se creó en Windows).
      - name: Unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew test --console=plain

      - name: Build debug app
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain

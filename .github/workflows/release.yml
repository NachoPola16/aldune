name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Aldune/Aldune.csproj -r win-x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable package
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @assets --title "Aldune $env:GITHUB_REF_NAME" --generate-notes

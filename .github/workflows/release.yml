name: Release Windows

on:
  push:
    tags:
      - "v*"

# Permisos mínimos por defecto: el único job que escribe en el repositorio (publish) lo declara él mismo. Así un paquete NuGet o de
# Chocolatey comprometido que se ejecute durante la compilación no tiene un token con permiso de escritura a mano.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      # La firma con SignPath lee los artefactos de este run.
      actions: read

    # La firma se activa sola cuando existen todas: las variables del repositorio
    # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG y las dos de configuración
    # de artefacto, y el secreto SIGNPATH_API_TOKEN (ver docs/RELEASING.md). Si falta alguna, el release
    # se publica sin firmar, en vez de fallar a medias.
    env:
      SIGNING_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_POLICY_SLUG != '' && vars.SIGNPATH_EXE_CONFIGURATION_SLUG != '' && vars.SIGNPATH_SETUP_CONFIGURATION_SLUG != '' && secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Aldune/Aldune.csproj -r win-x64

      - name: Test
        run: dotnet test Aldune.slnx --configuration Release

      - name: Install Inno Setup
        # Versión fija: Inno Setup genera el instalador que firma SignPath, y "latest" lo cambiaría sin que nadie lo vea.
        # --require-checksums: Chocolatey se niega a instalar un paquete cuyas descargas no traigan checksum (las HTTPS quedan exentas, y la de Inno Setup lo es).
        run: choco install innosetup --version=6.7.1 --require-checksums --no-progress -y

      - name: Publish portable executable
        shell: pwsh
        run: |
          dotnet publish src/Aldune/Aldune.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false `
            -o publish/portable
          Remove-Item publish/portable/*.pdb -Force -ErrorAction SilentlyContinue

      # --- Firma del ejecutable (opcional) -------------------------------------------------------
      - name: Upload executable for signing
        if: env.SIGNING_ENABLED == 'true'
        id: upload-exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-exe
          path: publish/portable/aldune.exe

      - name: Sign executable with SignPath
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish/portable

      # Si la firma está activa, lo que se va a empaquetar tiene que llevar una firma válida: así un fallo silencioso de
      # SignPath no acaba publicado como si estuviera firmado.
      - name: Verify executable signature
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature publish/portable/aldune.exe
          if ($sig.Status -ne 'Valid') { throw "aldune.exe no lleva una firma válida: $($sig.Status)" }

      # --- Instalador y portable, ya con el ejecutable firmado si procede --------------------------
      - name: Build installer and portable package
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipPublish

      # Portable nativo para Windows en ARM64 (sin instalador: el de x64 también instala en ARM, emulado). Va sin
      # firmar y, si falla, el release sale igual con lo de x64 (continue-on-error). Ver docs/DESKTOP_PORT.md.
      - name: Build ARM64 portable package
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet publish src/Aldune/Aldune.csproj -c Release -r win-arm64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false `
            -o publish/arm64
          Compress-Archive -Path publish/arm64/aldune.exe -DestinationPath dist/aldune-portable-win-arm64.zip -Force

      - name: Upload installer for signing
        if: env.SIGNING_ENABLED == 'true'
        id: upload-setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-setup
          path: dist/Aldune-Setup-*.exe

      - name: Sign installer with SignPath
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Verify installer signature
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem dist/Aldune-Setup-*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) no lleva una firma válida: $($sig.Status)" }
          }

      # Quien descarga sin firma (o quiere comprobar lo que le llegó) tiene así el SHA-256 de cada fichero.
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath dist -File -Include *.exe, *.zip -Recurse |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      # --- Entrega al job de publicación -------------------------------------------------------------
      # El job build no escribe en el repositorio: deja lo que se va a publicar como artefacto y publish lo recoge.
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # --- Publicación ---------------------------------------------------------------------------------
  # Único job con permiso de escritura: no compila ni ejecuta nada de terceros, solo descarga lo que dejó build y crea la release.
  # Un tag con guion (v0.99.0-rc1) se publica como pre-release: GitHub no lo ofrece como "latest"
  # y el aviso de actualizaciones de la app (ReleaseUpdateChecker) lo ignora.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.zip dist/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY" --title "Aldune $GITHUB_REF_NAME" --generate-notes "${flags[@]}"

name: Bug
description: Something does not work as you expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste profile codes, tokens or the content of your notes. If it is a vulnerability, **do not** use an issue: see SECURITY.md.
        English or Spanish are both fine / vale en español.
  - type: dropdown
    id: platform
    attributes:
      label: Where it happens
      options: [Windows, Android, Sync server]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: It is in Settings (for example, 2.1.5 on Windows or 1.0.2 on Android).
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Windows version, or Android model and version.
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true

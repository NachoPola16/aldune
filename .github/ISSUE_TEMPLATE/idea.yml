name: Una idea
description: Algo que te gustaría que hiciera
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Qué quieres conseguir
      description: Cuéntalo como problema («cuando hago X me cuesta Y»), no solo como solución.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Cómo lo imaginas
  - type: markdown
    attributes:
      value: Antes de pedir algo, mira `docs/ROADMAP.md`: recoge lo que ya se descartó y por qué.

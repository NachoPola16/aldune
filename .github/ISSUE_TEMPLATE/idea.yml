name: Idea
description: Something you would like it to do
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to achieve
      description: Tell it as a problem (“when I do X it is hard to Y”), not only as a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
  - type: markdown
    attributes:
      value: Before asking for something, search the existing issues and read `docs/PROGRESS.md`: it tells what the app already does and how it got there.

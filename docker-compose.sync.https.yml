services:
  fanote-sync:
    build:
      context: .
      dockerfile: src/Fanote.SyncServer/Dockerfile
    container_name: fanote-sync
    restart: unless-stopped
    environment:
      FANOTE_SYNC_TOKEN: ${FANOTE_SYNC_TOKEN:?Define FANOTE_SYNC_TOKEN in .env}
      FANOTE_SYNC_TOKENS: ${FANOTE_SYNC_TOKENS:-}
      FANOTE_DATA_DIR: /data
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"
    volumes:
      - fanote-sync-data:/data

  caddy:
    image: caddy:2-alpine
    container_name: fanote-sync-caddy
    restart: unless-stopped
    environment:
      FANOTE_SYNC_DOMAIN: ${FANOTE_SYNC_DOMAIN:?Define FANOTE_SYNC_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - fanote-sync

volumes:
  fanote-sync-data:
  caddy-data:
  caddy-config:

services:
  aldune-sync:
    build:
      context: .
      dockerfile: src/Aldune.SyncServer/Dockerfile
    container_name: aldune-sync
    restart: unless-stopped
    environment:
      # ALDUNE_* es el nombre actual; el fallback conserva los .env antiguos.
      ALDUNE_SYNC_TOKEN: ${ALDUNE_SYNC_TOKEN:-${FANOTE_SYNC_TOKEN:-}}
      ALDUNE_SYNC_TOKENS: ${ALDUNE_SYNC_TOKENS:-${FANOTE_SYNC_TOKENS:-}}
      ALDUNE_DATA_DIR: /data
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"
    volumes:
      - aldune-sync-data:/data

  caddy:
    image: caddy:2-alpine
    container_name: aldune-sync-caddy
    restart: unless-stopped
    environment:
      ALDUNE_SYNC_DOMAIN: ${ALDUNE_SYNC_DOMAIN:-${FANOTE_SYNC_DOMAIN:?Define ALDUNE_SYNC_DOMAIN (or legacy FANOTE_SYNC_DOMAIN) in .env}}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - aldune-sync

volumes:
  # Mantiene el nombre físico anterior para no perder los datos ya sincronizados.
  aldune-sync-data:
    name: fanote-sync-data
  caddy-data:
  caddy-config:

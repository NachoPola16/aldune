services:
  aldune-sync:
    build:
      context: .
      dockerfile: src/Aldune.SyncServer/Dockerfile
    container_name: aldune-sync
    restart: unless-stopped
    # The process cannot gain new privileges (setuid and the like) even if it is compromised.
    security_opt:
      - no-new-privileges:true
    environment:
      # Variable names: BrandIdentity.SyncTokenEnvVar / SyncTokensEnvVar (Aldune.Core).
      ALDUNE_SYNC_TOKEN: ${ALDUNE_SYNC_TOKEN:-}
      ALDUNE_SYNC_TOKENS: ${ALDUNE_SYNC_TOKENS:-}
      ALDUNE_DATA_DIR: /data
      # Failed-token attempt limit per address (docs/SYNC.md → "Failed-attempt limit").
      ALDUNE_SYNC_MAX_AUTH_FAILURES_PER_MINUTE: ${ALDUNE_SYNC_MAX_AUTH_FAILURES_PER_MINUTE:-}
      ALDUNE_SYNC_TRUST_PROXY: ${ALDUNE_SYNC_TRUST_PROXY:-1}
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"
    volumes:
      - aldune-sync-data:/data

  caddy:
    image: caddy:2-alpine
    container_name: aldune-sync-caddy
    restart: unless-stopped
    environment:
      ALDUNE_SYNC_DOMAIN: ${ALDUNE_SYNC_DOMAIN:?Define ALDUNE_SYNC_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - aldune-sync

volumes:
  # Physical name of the volume on the server. It is configurable so that a server that
  # already synced before the rebrand keeps using the volume it had, instead of starting
  # with an empty store.
  aldune-sync-data:
    name: ${ALDUNE_SYNC_VOLUME:-aldune-sync-data}
  caddy-data:
  caddy-config:
